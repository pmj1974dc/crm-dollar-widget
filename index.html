<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dollar Today</title>
<style>
body{margin:0;padding:20px;font-family:Arial;background:#f4f7fb}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.title{font-size:22px;font-weight:bold;color:#1f2937}
.value{font-size:42px;color:#16a34a;margin-top:10px}
.sub{margin-top:10px;color:#6b7280}
.error{color:#dc2626;margin-top:10px}
</style>
</head>
<body>

<div class="card">
  <div class="title">USD/BRL Exchange Rate</div>
  <div class="value" id="rate">Loading...</div>
  <div class="sub" id="date">Fetching latest rate...</div>
  <div class="error" id="error"></div>
</div>

<script>
async function loadRate() {
  try {
    const response = await fetch("https://open.er-api.com/v6/latest/USD");
    const data = await response.json();

    const brl = data.rates.BRL;
    document.getElementById("rate").innerText =
      "R$ " + brl.toFixed(2).replace(".", ",");

    document.getElementById("date").innerText =
      "Last update: " + new Date().toLocaleString("pt-BR");
  } catch (e) {
    document.getElementById("rate").innerText = "Unavailable";
    document.getElementById("error").innerText =
      "Could not fetch exchange rate.";
  }
}

loadRate();
</script>

</body>
</html>
