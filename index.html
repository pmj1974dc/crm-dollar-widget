<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FX Rates Widget</title>
<style>
body{margin:0;padding:20px;font-family:Arial;background:#f4f7fb}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.title{font-size:16px;font-weight:bold;color:#1f2937}
.value{font-size:32px;color:#16a34a;margin-top:10px;font-weight:bold}
.sub{margin-top:10px;color:#6b7280;font-size:12px}
.error{color:#dc2626;margin-top:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="grid">
  <div class="card">
    <div class="title">USD / BRL</div>
    <div class="value" id="brl">Loading...</div>
    <div class="sub" id="brlDate"></div>
  </div>

  <div class="card">
    <div class="title">USD / DOP</div>
    <div class="value" id="dop">Loading...</div>
    <div class="sub" id="dopDate"></div>
  </div>

  <div class="card">
    <div class="title">USD / EUR</div>
    <div class="value" id="eur">Loading...</div>
    <div class="sub" id="eurDate"></div>
  </div>
</div>

<div class="error" id="error"></div>

<script>
async function loadRates() {
  try {
    const response = await fetch("https://open.er-api.com/v6/latest/USD");
    const data = await response.json();

    const brl = data.rates.BRL;
    const dop = data.rates.DOP;
    const eur = data.rates.EUR;

    document.getElementById("brl").innerText = "R$ " + brl.toFixed(2).replace(".", ",");
    document.getElementById("dop").innerText = "RD$ " + dop.toFixed(2);
    document.getElementById("eur").innerText = "€ " + eur.toFixed(2);

    const updated = "Last update: " + new Date().toLocaleString("pt-BR");

    document.getElementById("brlDate").innerText = updated;
    document.getElementById("dopDate").innerText = updated;
    document.getElementById("eurDate").innerText = updated;

  } catch (e) {
    document.getElementById("error").innerText = "Could not fetch exchange rates.";
  }
}

loadRates();
</script>

</body>
</html>
